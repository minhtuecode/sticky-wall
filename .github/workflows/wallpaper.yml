name: Render wallpaper

on:
  schedule:
    - cron: '0 22 * * *'
  push:
    branches: [main]
    paths: ['notes.json', 'lib/**', 'scripts/render.mjs', 'fonts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpaper
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/render.mjs
      - name: Commit ảnh mới
        run: |
          git config user.name "wallpaper-bot"
          git config user.email "wallpaper-bot@users.noreply.github.com"
          git add wallpaper-today.png
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "Wallpaper $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git push
          fi
